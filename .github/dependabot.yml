# Abhängigkeiten regelmäßig aktualisieren (Sicherheitsupdates kommen sofort,
# normale Updates gesammelt einmal pro Woche).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-und-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
