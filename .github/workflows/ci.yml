# Automatische Prüfung bei jedem Push und Pull Request:
# Typen, Tests (Buchungslogik, Preise, Zahlung, Kalender), Datenbanktests
# gegen ein echtes Postgres (Schreibrechte, Belege, Sicherung und
# Wiederherstellung) und Build.
# Ausgerollt wird über Lovable (Publish); dieser Lauf verhindert, dass
# kaputter Code dort ankommt.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RECHTE_TEST_DB: postgres://postgres@localhost:5432/rechte
      SICHERUNG_TEST_DB: postgres://postgres@localhost:5432/sicherung
      BELEGE_TEST_DB: postgres://postgres@localhost:5432/belege
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testdatenbanken anlegen
        run: for db in rechte sicherung belege; do psql -h localhost -U postgres -c "create database $db"; done
      - name: Typen prüfen
        run: npx tsc --noEmit -p .
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Bekannte Sicherheitslücken in Abhängigkeiten (nur hohe und kritische)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
